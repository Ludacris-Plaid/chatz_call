[public]
exten => 555,1,Answer()
same => n,Playback(beep)
same => n,Playback(vm-nobodyavail)
same => n,Hangup()
exten => s,1,NoOp(Connected leg)
same => n,Echo()
same => n,Hangup()

; Outbound dialplan — handles both WebRTC (short CALLERID = extension) and call-file (long CALLERID = phone number)
exten => _+1NXXNXXXXXX,1,NoOp(Outbound call to ${EXTEN})
same => n,Set(EX=${CALLERID(num)})
same => n,GotoIf($[${LEN(${EX})} > 9]?use_direct)
same => n,Set(CID=${DB(CALLERID/${EX})})
same => n,GotoIf($[${LEN(${CID})} > 9]?setcid)
same => n,Set(CID=17804755555)
same => n(setcid),Set(CALLERID(all)=${CID})
same => n,Dial(PJSIP/sipup-trunk/sip:${EXTEN}@sip.sipup.org)
same => n,Hangup()
same => n(use_direct),Set(CALLERID(all)=${EX})
same => n,Dial(PJSIP/sipup-trunk/sip:${EXTEN}@sip.sipup.org)
same => n,Hangup()

