; ── ClawCall Dialplan ────────────────────────────────────
[public]

; Outbound: browser → PSTN via SIP.UP
exten => _+1NXXNXXXXXX,1,Set(CALLERID(num)=${PJSIP_HEADER(read,X-Caller-ID)})
same => n,Set(CALLERID(name)=${PJSIP_HEADER(read,X-Caller-Name)})
same => n,Dial(PJSIP/${EXTEN}@sipup-trunk)
same => n,Hangup()

exten => _1NXXNXXXXXX,1,Set(CALLERID(num)=${PJSIP_HEADER(read,X-Caller-ID)})
same => n,Set(CALLERID(name)=${PJSIP_HEADER(read,X-Caller-Name)})
same => n,Dial(PJSIP/${EXTEN}@sipup-trunk)
same => n,Hangup()

exten => _NXXNXXXXXX,1,Set(CALLERID(num)=${PJSIP_HEADER(read,X-Caller-ID)})
same => n,Set(CALLERID(name)=${PJSIP_HEADER(read,X-Caller-Name)})
same => n,Dial(PJSIP/1${EXTEN}@sipup-trunk)
same => n,Hangup()

; Inbound: trunk → registered browser
exten => 7001,1,Dial(PJSIP/7001)
same => n,Hangup()

; Echo test
exten => 9196,1,Answer()
same => n,Echo()
same => n,Hangup()
