; ClawCall Asterisk PJSIP Config — Ringback fix: trunk bare, no media interception
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088
external_media_address=18.223.24.42
external_signaling_address=18.223.24.42

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5080
external_media_address=18.223.24.42
external_signaling_address=18.223.24.42

; ── WebRTC Browser Template ──────────────────────────────────
[webrtc-template](!)
type=endpoint
transport=transport-ws
context=from-internal
disallow=all
allow=ulaw,alaw,opus
dtmf_mode=rfc4733
direct_media=no
media_encryption=dtls
ice_support=yes
force_avp=yes
webrtc=yes
rtp_symmetric=yes
media_address=18.223.24.42
send_pai=yes
trust_id_outbound=yes
from_user=
from_domain=hushcircuits.online

; ── SIP.UP Trunk — BARE, no media tampering ─────────────────
[sipup-auth]
type=auth
auth_type=userpass
username=10428
password=Mcjhv877KAK9

[sipup-trunk]
type=aor
contact=sip:sip.sipup.org:5060

[sipup-trunk]
type=endpoint
transport=transport-udp
context=public
disallow=all
allow=ulaw,alaw
dtmf_mode=rfc4733
outbound_auth=sipup-auth
aors=sipup-trunk
from_user=10428
from_domain=sip.sipup.org
send_pai=yes
trust_id_outbound=yes

[sipup-reg]
type=registration
outbound_auth=sipup-auth
client_uri=sip:10428@sip.sipup.org:5060
server_uri=sip:sip.sipup.org:5060

[sipup-identify]
type=identify
endpoint=sipup-trunk
match=sip.sipup.org

