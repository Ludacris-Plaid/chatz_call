; ── ClawCall Asterisk PJSIP Config ──────────────────────
; WebRTC (WSS) + SIP.UP trunk

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:7443
cert_file=/etc/asterisk/tls/wss.pem
key_file=/etc/asterisk/tls/wss.pem

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5080
external_media_address=18.223.24.42
external_signaling_address=18.223.24.42

; ── Browser WebRTC endpoint ────────────────────────────
[7001](webrtc-template)
type=aor
max_contacts=5

[7001]
type=auth
auth_type=userpass
username=7001
password=7001pass

[7001]
type=endpoint
context=public
disallow=all
allow=opus,ulaw,alaw
dtmf_mode=rfc4733
aors=7001
auth=7001
webrtc=yes
ice_support=yes
media_encryption=dtls
use_avpf=yes
force_avp=yes
rtp_symmetric=yes
direct_media=no
send_pai=yes

; ── SIP.UP Trunk ──────────────────────────────────────
[sipup-trunk]
type=registration
outbound_auth=sipup-auth
client_uri=sip:10428@sip.sipup.org:5060
server_uri=sip:sip.sipup.org:5060

[sipup-auth]
type=auth
auth_type=userpass
username=10428
password=tjmoVhp4zUZp4x

[sipup-trunk]
type=aor
contact=sip:sip.sipup.org:5060

[sipup-trunk]
type=identify
endpoint=sipup-trunk
match=sip.sipup.org

[sipup-trunk]
type=endpoint
context=public
disallow=all
allow=ulaw,alaw
dtmf_mode=rfc4733
outbound_auth=sipup-auth
aors=sipup-trunk
from_user=10428
from_domain=sip.sipup.org
send_pai=yes
trust_id_outbound=yes
