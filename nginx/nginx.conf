# ClawCall VoIP – Nginx Reverse Proxy Configuration
# SSL termination, WebSocket proxying, and static file serving.

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ── Basic Settings ────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;
    server_tokens off;

    # ── Rate Limiting Zones ──────────────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api:10m  rate=10r/s;
    limit_req_zone  $binary_remote_addr  zone=ws:10m   rate=30r/s;

    # ── Logging ──────────────────────────────────────────────────
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # ── Upstream Backends ────────────────────────────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream asterisk_ws {
        server 172.17.0.1:7443;
        keepalive 32;
    }

    # ── HTTP Server (Let's Encrypt ACME + redirect to HTTPS) ─────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name hushcircuits.online;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            allow all;
        }

        # Redirect all other HTTP to HTTPS
        location / {
        # Block dotfiles (security)
        location ~ /\. { deny all; }
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Server ────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name hushcircuits.online;

        # ── SSL Configuration ────────────────────────────────────
        # Self-signed fallback certs (replace with Let's Encrypt)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Modern TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ── WebSocket Proxy (SIP.js WSS → FreeSWITCH) ───────────
        location /ws {
            limit_req zone=ws burst=20 nodelay;

            proxy_pass https://172.17.0.1:7443;
            proxy_ssl_verify off;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Forward original client info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for persistent WebSocket connections
            proxy_read_timeout    86400s;
            proxy_send_timeout    86400s;
            proxy_connect_timeout 30s;

            # Buffer settings
            proxy_buffering off;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Allow CORS for SIP.js
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
        }

        # ── API Proxy (Backend Python on port 8090) ──────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            
            # Use variable-based proxy_pass for Docker DNS compatibility
            set $backend clawcall-backend;
            proxy_pass http://$backend:8090;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
            proxy_connect_timeout 10s;
        }

        # ── Static Files (Frontend) ──────────────────────────────
        location / {
        # Block dotfiles (security)
        location ~ /\. { deny all; }
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires -1;
                add_header Cache-Control "no-store";
            }
        }
    }
}
