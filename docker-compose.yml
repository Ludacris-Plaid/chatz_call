networks:
  voip-net:
    driver: bridge

services:
  # Asterisk — WebRTC + SIP.UP trunk
  asterisk:
    build:
      context: .
      dockerfile: asterisk/Dockerfile
    container_name: clawcall-asterisk
    restart: unless-stopped
    network_mode: host
    environment:
      - WEBSMSD_PORT=disabled
    volumes:
      - ./asterisk:/etc/asterisk:ro
      - /var/spool/clawcall:/var/spool/asterisk/outgoing
    deploy:
      resources:
        limits:
          memory: 1G

  # Backend — Python API + Frontend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: clawcall-backend
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - API_PORT=8090
      - DOMAIN=hushcircuits.online
      - PUBLIC_IP=18.223.24.42
      - SUPABASE_URL=https://kgnwqwghnosgieldiokc.supabase.co
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnbndxd2dobm9zZ2llbGRpb2tjIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODgyMTcwNywiZXhwIjoyMDk0Mzk3NzA3fQ.h5spGDu8JjTZY2qaZg3wtKaD5VjNj8Ihss669kVs2oc
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtnbndxd2dobm9zZ2llbGRpb2tjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MjE3MDcsImV4cCI6MjA5NDM5NzcwN30.KgwVXGdjg_2GMfufnvbrRuaRB1HbWhtxRDttcyg6oJA
      - NOWPAYMENTS_API_KEY=9ED8ZNB-1ZNMGM6-J92MPHH-BA68DV7
      - NOWPAYMENTS_IPN_SECRET=5rrV57CTZPOaA8nLqDkHCZdrWEEXGLpK
      - SIPUP_USERNAME=10428
      - SIPUP_PASSWORD=Mcjhv877KAK9
      - ADMIN_USERNAME=dysthemix
      - AMI_HOST=172.21.0.1
      - AMI_PORT=5038
      - AMI_USER=clawcall
      - AMI_SECRET=clawcall_ami_secret_2026
      - PRICE_PER_MINUTE=0.50
      - VIP_WEEKLY_PRICE=250.00
      - COOKIE_SECRET=clawcall-dev-secret-change-in-production
    volumes:
      - ./server.py:/app/server.py
      - ./caller_id.py:/app/caller_id.py
      - ./supabase_auth.py:/app/supabase_auth.py
      - ./supabase_data.py:/app/supabase_data.py
      - ./supabase_voucher.py:/app/supabase_voucher.py
      - ./frontend:/app/frontend
      - /var/spool/clawcall:/var/spool/asterisk/outgoing
    networks:
      - voip-net

  # Nginx — Reverse Proxy + TLS
  nginx:
    image: nginx:alpine
    container_name: clawcall-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    container_name: clawcall-certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./frontend:/var/www/certbot
    entrypoint: >-
      sh -c "trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $!;
      done"
