# ClawCall VoIP – Coturn STUN/TURN Server Configuration
# Provides NAT traversal for WebRTC media streams.

# ── General ──────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0
external-ip=${PUBLIC_IP}

# ── Relay Port Range ────────────────────────────────────
min-port=49152
max-port=65535

# ── Realm ───────────────────────────────────────────────
realm=hushcircuits.online

# ── Authentication (Long-Term Credential Mechanism) ────
lt-cred-mech
user=turnuser:turnpassword

# ── TLS ─────────────────────────────────────────────────
cert=/etc/letsencrypt/live/hushcircuits.online/fullchain.pem
pkey=/etc/letsencrypt/live/hushcircuits.online/privkey.pem

# ── STUN Only (no relay) Fallback ───────────────────────
stale-nonce=600
no-multicast-peers
no-loopback-peers

# ── Logging ─────────────────────────────────────────────
verbose
syslog
