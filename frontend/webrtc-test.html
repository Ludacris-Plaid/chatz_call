<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>ClawCall WebRTC Test</title>
<style>
body { background: #0a0a0a; color: #22c55e; font-family: monospace; padding: 20px; }
h2 { color: #22c55e; }
#log { background: #111; border: 1px solid #333; padding: 10px; height: 400px; overflow-y: auto; font-size: 12px; margin: 10px 0; white-space: pre-wrap; }
button { background: #22c55e; color: #000; border: none; padding: 8px 16px; margin: 4px; cursor: pointer; font-family: monospace; font-weight: bold; }
button:disabled { background: #333; color: #666; }
input { background: #111; color: #22c55e; border: 1px solid #333; padding: 6px 10px; font-family: monospace; margin: 4px; }
.status { padding: 4px 8px; border-radius: 4px; display: inline-block; margin: 4px; }
.registered { background: rgba(34,197,94,0.2); color: #22c55e; }
.unregistered { background: rgba(239,68,68,0.2); color: #ef4444; }
</style>
</head>
<body>
<h2>ClawCall WebRTC Test</h2>
<div>
  <label>Ext: <input id="ext" value="7002" style="width:80px"></label>
  <label>Pwd: <input id="pwd" value="ed478a4b5f590e6e" style="width:180px"></label>
  <label>Dest: <input id="dest" value="9196" style="width:80px"></label>
</div>
<div>
  <button id="btnWsTest" onclick="testWs()">TEST WS</button>
  <button id="btnRegister" onclick="doRegister()">REGISTER</button>
  <button id="btnCall" onclick="doCall()" disabled>CALL Echo</button>
  <button id="btnHangup" onclick="doHangup()" disabled>HANGUP</button>
  <button id="btnUnregister" onclick="doUnregister()" disabled>UNREGISTER</button>
</div>
<div id="statusBar" class="status unregistered">UNREGISTERED</div>
<audio id="remoteAudio" autoplay playsinline></audio>
<div id="log"></div>
<script src="sip.min.js"></script>
<script>
var ua = null, session = null;
function log(m) {
  var el = document.getElementById("log");
  el.textContent += "[" + new Date().toLocaleTimeString() + "] " + m + "\n";
  el.scrollTop = el.scrollHeight;
  console.log(m);
}

function testWs() {
  var wsUri = "wss://" + window.location.host + "/ws";
  log("Testing raw WebSocket: " + wsUri);
  try {
    var ws = new WebSocket(wsUri, "sip");
    ws.onopen = function() { log("WS OPEN!"); ws.close(); };
    ws.onerror = function(e) { log("WS ERROR: " + JSON.stringify(e)); };
    ws.onclose = function() { log("WS CLOSED"); };
  } catch(e) {
    log("WS create error: " + e.message);
  }
}

function doRegister() {
  var ext = document.getElementById("ext").value;
  var pwd = document.getElementById("pwd").value;
  var hostname = window.location.hostname;
  var wsUri = "wss://" + window.location.host + "/ws";

  log("SIP version: " + (SIP.version || "unknown"));
  log("Registering " + ext + " via " + wsUri);

  try {
    ua = new SIP.UA({
      uri: ext + "@" + hostname,
      ws_servers: [wsUri],
      authorization_user: ext,
      password: pwd,
      register: true,
      register_expires: 300,
      trace_sip: true,
      sessionDescriptionHandlerFactoryOptions: {
        peerConnectionConfiguration: {
          iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        }
      },
      hack_ip_in_contact: true,
      hack_wss_in_transport: true,
      no_answer_timeout: 60
    });

    ua.on("connected", function() { log("WS connected"); });
    ua.on("disconnected", function() { log("WS disconnected"); });
    ua.on("registered", function() {
      log("REGISTERED!");
      document.getElementById("statusBar").className = "status registered";
      document.getElementById("statusBar").textContent = "REGISTERED";
      document.getElementById("btnRegister").disabled = true;
      document.getElementById("btnCall").disabled = false;
      document.getElementById("btnUnregister").disabled = false;
    });
    ua.on("unregistered", function() { log("Unregistered"); });
    ua.on("registrationFailed", function(details) {
      log("Reg FAILED: " + (details.cause || JSON.stringify(details)));
    });
    ua.on("invite", function(s) {
      log("Incoming call from " + s.remote_identity.uri.user);
      session = s;
      s.accept({ media: { constraints: { audio: true, video: false } } });
    });

    log("UA started");
  } catch(e) {
    log("ERROR: " + e.message);
  }
}

function doCall() {
  var dest = document.getElementById("dest").value;
  var hostname = window.location.hostname;
  log("Calling " + dest);

  session = ua.invite(dest + "@" + hostname, {
    media: { constraints: { audio: true, video: false } }
  });

  session.on("accepted", function() { log("Accepted"); });
  session.on("confirmed", function() {
    log("Confirmed - audio should play");
    document.getElementById("btnHangup").disabled = false;
    document.getElementById("btnCall").disabled = true;
  });
  session.on("terminated", function() {
    log("Terminated");
    document.getElementById("btnHangup").disabled = true;
    document.getElementById("btnCall").disabled = false;
    session = null;
  });
  session.on("failed", function(details) {
    log("Failed: " + (details.cause || "unknown"));
    document.getElementById("btnHangup").disabled = true;
    document.getElementById("btnCall").disabled = false;
    session = null;
  });
}

function doHangup() {
  if (session) { log("Hanging up"); session.bye(); }
}

function doUnregister() {
  if (ua) { ua.stop(); ua = null; log("Stopped");
    document.getElementById("statusBar").className = "status unregistered";
    document.getElementById("statusBar").textContent = "UNREGISTERED";
    document.getElementById("btnRegister").disabled = false;
    document.getElementById("btnCall").disabled = true;
    document.getElementById("btnUnregister").disabled = true;
  }
}
</script>
</body>
</html>
